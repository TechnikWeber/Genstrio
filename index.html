<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Parametric generators for 3D printing: enclosures, pipe adapters, drawer organizers, Gridfinity, hooks, signs. Runs entirely in your browser." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Genstrio</title>
  </head>
  <body>
    <div id="app">
      <aside class="panel">
        <header>
          <img src="./icon.svg" alt="" width="34" height="34" />
          <div>
            <h1>Genstrio</h1>
            <p id="tagline"></p>
          </div>
          <select id="unit"></select>
          <button id="lang" type="button" class="ghost"></button>
        </header>
        <nav id="tools"></nav>
        <p id="desc"></p>
        <select id="template"></select>
        <form id="params" autocomplete="off" onsubmit="return false"></form>
        <footer>
          <span id="export-label"></span>
          <div id="export"></div>
          <select id="only" hidden></select>
          <details id="project">
            <summary id="project-label"></summary>
            <div class="menu">
              <div class="row">
                <input id="tpl-name" type="text" maxlength="40" />
                <button id="tpl-save" type="button" class="ghost"></button>
              </div>
              <button id="tpl-delete" type="button" class="ghost"></button>
              <button id="file-save" type="button" class="ghost"></button>
              <button id="file-open" type="button" class="ghost"></button>
              <input id="file-input" type="file" accept=".json,application/json" hidden />
              <button id="share" type="button" class="ghost"></button>
              <button id="reset" type="button" class="ghost"></button>
            </div>
          </details>
          <a id="version" href="https://github.com/TechnikWeber/Genstrio" target="_blank" rel="noopener"></a>
        </footer>
      </aside>
      <main>
        <div id="viewer"></div>
        <div class="overlay top">
          <p id="status" role="status" class="busy"></p>
          <span class="view-tools">
            <button id="assembled" type="button" class="ghost" aria-pressed="false" hidden></button>
            <button id="fit" type="button" class="ghost">
              <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
            </button>
          </span>
        </div>
        <div class="overlay bottom">
          <details id="notes-box" hidden>
            <summary id="notes-label"></summary>
            <ul id="notes"></ul>
          </details>
          <p id="hint"></p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
